<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление телевизором голосом — Алиса</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        alice: {
                            DEFAULT: '#7b3fe4',
                            dark: '#6c2bd9',
                            light: '#f3effd',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #ffffff;
            color: #111827;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Мягкое светлое свечение на фоне */
        .ambient-light {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 50% -10%, rgba(123, 63, 228, 0.08) 0%, transparent 55%),
                radial-gradient(circle at 90% 20%, rgba(236, 72, 153, 0.05) 0%, transparent 40%),
                #ffffff;
        }

        /* Плавная левитация логотипа */
        @keyframes float-logo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 0.45; }
            50% { transform: scale(1.12); opacity: 0.75; }
        }

        .logo-float {
            animation: float-logo 4s ease-in-out infinite;
        }

        .logo-glow {
            animation: pulse-ring 3.5s ease-in-out infinite;
        }

        /* Компактные Bento-карточки */
        .bento-card {
            background: #f7f8fa;
            border: 1px solid #ebedf2;
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .bento-card:hover {
            background: #ffffff;
            border-color: rgba(123, 63, 228, 0.3);
            box-shadow: 0 10px 28px -10px rgba(123, 63, 228, 0.12);
            transform: translateY(-2px);
        }

        /* Строка команды */
        .cmd-row {
            transition: all 0.16s ease;
        }
        .cmd-row:hover {
            background: #ffffff;
            border-color: rgba(123, 63, 228, 0.35);
            box-shadow: 0 2px 8px rgba(123, 63, 228, 0.07);
        }
        .cmd-row:active {
            transform: scale(0.985);
        }

        /* Плавное появление */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up {
            animation: fadeUp 0.35s ease forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <div class="ambient-light"></div>

    <!-- Всплывающее уведомление о копировании -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 pointer-events-none opacity-0 translate-y-3 transition-all duration-200">
        <div class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-2xl bg-gray-900 text-white shadow-xl border border-gray-800">
            <div class="w-6 h-6 rounded-lg bg-[#7b3fe4] flex items-center justify-center text-white shrink-0">
                <i data-lucide="check" class="w-3.5 h-3.5"></i>
            </div>
            <div class="text-xs">
                <span class="text-gray-400">Скопировано:</span>
                <span id="toast-msg" class="font-semibold text-white ml-1">«включи ютуб»</span>
            </div>
        </div>
    </div>

    <main class="max-w-6xl w-full mx-auto px-4 sm:px-6 pt-5 pb-6">

        <!-- КОМПАКТНАЯ ШАПКА (HERO) -->
        <header class="flex flex-col sm:flex-row items-center justify-between gap-4 pb-5 mb-5 border-b border-gray-100">
            <div class="flex items-center gap-3.5 text-center sm:text-left flex-col sm:flex-row">
                <!-- Логотип Алисы -->
                <div class="relative logo-float shrink-0">
                    <div class="absolute -inset-1.5 rounded-2xl bg-gradient-to-tr from-[#7b3fe4]/30 to-pink-500/25 blur-md logo-glow"></div>
                    <div class="relative w-12 h-12 rounded-2xl bg-white border border-purple-100 shadow-sm flex items-center justify-center p-1.5">
                        <img src="https://avatars.mds.yandex.net/get-lpc/1370085/e8ea3f80-599d-40be-ac8c-4a8f975a3339/orig"
                             alt="Алиса"
                             class="w-full h-full object-contain"
                             onerror="this.onerror=null; this.src='https://placehold.co/80x80/7b3fe4/ffffff?text=A';">
                    </div>
                </div>
                <div>
                    <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-[#f3effd] text-[#6c2bd9] text-[11px] font-semibold mb-0.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-[#7b3fe4] animate-pulse"></span>
                        Яндекс Станция × Smart TV
                    </div>
                    <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-gray-900">
                        Управление телевизором голосом
                    </h1>
                </div>
            </div>

            <!-- Заголовок «Что можно делать?» + быстрый поиск и фильтр в одну строчку -->
            <div class="flex flex-wrap items-center justify-center sm:justify-end gap-2 w-full sm:w-auto">
                <div class="relative w-full sm:w-56">
                    <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    <input id="search-input" type="text" oninput="handleSearch(this.value)"
                           placeholder="Быстрый поиск команды..."
                           class="w-full pl-8 pr-3 py-1.5 rounded-xl bg-[#f5f6f9] border border-gray-200/80 focus:bg-white focus:border-[#7b3fe4] focus:outline-none text-xs text-gray-800 placeholder-gray-400 transition">
                </div>
            </div>
        </header>

        <!-- ЗАГОЛОВОК РАЗДЕЛА + МИНИ-ФИЛЬТРЫ -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 mb-3.5">
            <div class="flex items-center gap-2">
                <h2 class="text-base sm:text-lg font-bold text-gray-900">Что можно делать?</h2>
                <span class="text-[11px] text-gray-400 font-medium hidden md:inline">— нажми на команду, чтобы скопировать</span>
            </div>

            <!-- Компактные пилюли категорий -->
            <div id="category-tabs" class="flex items-center gap-1 overflow-x-auto pb-1 sm:pb-0">
                <button onclick="filterCategory('all')" data-cat="all" class="cat-btn px-2.5 py-1 rounded-lg text-xs font-semibold bg-[#7b3fe4] text-white transition shrink-0">Все</button>
                <button onclick="filterCategory('video')" data-cat="video" class="cat-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-[#f5f6f9] text-gray-600 hover:bg-gray-200/70 transition shrink-0">📺 Видео</button>
                <button onclick="filterCategory('search')" data-cat="search" class="cat-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-[#f5f6f9] text-gray-600 hover:bg-gray-200/70 transition shrink-0">🔍 Поиск</button>
                <button onclick="filterCategory('remote')" data-cat="remote" class="cat-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-[#f5f6f9] text-gray-600 hover:bg-gray-200/70 transition shrink-0">🕹 Пульт</button>
                <button onclick="filterCategory('sound')" data-cat="sound" class="cat-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-[#f5f6f9] text-gray-600 hover:bg-gray-200/70 transition shrink-0">🔊 Звук</button>
                <button onclick="filterCategory('power')" data-cat="power" class="cat-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-[#f5f6f9] text-gray-600 hover:bg-gray-200/70 transition shrink-0">⚡️ Экран</button>
                <button onclick="filterCategory('prank')" data-cat="prank" class="cat-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-[#f5f6f9] text-gray-600 hover:bg-gray-200/70 transition shrink-0">🎭 Пранки</button>
                <button onclick="filterCategory('exit')" data-cat="exit" class="cat-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-[#f5f6f9] text-gray-600 hover:bg-gray-200/70 transition shrink-0">🚪 Выход</button>
            </div>
        </div>

        <!-- КОМПАКТНАЯ BENTO-СЕТКА КОМАНД (3 колонки) -->
        <section id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mb-4">
            <!-- Заполняется скриптом -->
        </section>

        <!-- КОМПАКТНЫЙ БЛОК: ФРАЗЫ, КОТОРЫЕ ПОНИМАЕТ АЛИСА -->
        <section class="bento-card rounded-2xl p-3.5 sm:p-4 bg-gradient-to-r from-[#f8f6ff] via-[#f7f8fa] to-[#fdf4f9] border border-purple-100">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-2.5">
                <div class="flex items-center gap-2 shrink-0">
                    <span class="w-6 h-6 rounded-lg bg-[#7b3fe4]/10 text-[#7b3fe4] flex items-center justify-center">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                    </span>
                    <span class="text-xs sm:text-sm font-bold text-gray-900">
                        Фразы, которые понимает Алиса:
                    </span>
                </div>

                <!-- Кнопки-пилюли в ряд -->
                <div id="phrases-list" class="flex flex-wrap items-center gap-1.5">
                    <!-- Заполняется скриптом -->
                </div>
            </div>
        </section>

    </main>

    <!-- МИНИМАЛИСТИЧНЫЙ ПОДВАЛ -->
    <footer class="max-w-6xl w-full mx-auto px-4 sm:px-6 py-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-400">
        <span>Алиса × Управление ТВ</span>
        <a href="https://www.tiktok.com/@dqmjrka.live" target="_blank" rel="noopener noreferrer"
           class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#f5f6f9] hover:bg-[#f3effd] text-gray-700 hover:text-[#6c2bd9] font-mono font-semibold text-xs border border-gray-200/70 transition">
            <span class="w-1.5 h-1.5 rounded-full bg-[#7b3fe4]"></span>
            <span>by TT @dqmjrka.live</span>
        </a>
    </footer>

    <script>
        // Полный список всех категорий и команд без сокращений
        const COMMAND_CATEGORIES = [
            {
                id: 'video',
                emoji: '📺',
                title: 'Видео',
                commands: [
                    { cmd: '«включи видео [название]»', raw: 'включи видео', desc: 'находит и сразу запускает ролик на YouTube' },
                    { cmd: '«открой кинопоиск»', raw: 'открой кинопоиск', desc: 'запускает приложение Кинопоиск' },
                    { cmd: '«открой киного»', raw: 'открой киного', desc: 'открывает сайт kinogo.online' },
                    { cmd: '«включи ютуб»', raw: 'включи ютуб', desc: 'запускает главное меню YouTube' }
                ]
            },
            {
                id: 'sound',
                emoji: '🔊',
                title: 'Звук',
                commands: [
                    { cmd: '«звук тише»', raw: 'звук тише', desc: 'тише на 3 пункта' },
                    { cmd: '«звук громче»', raw: 'звук громче', desc: 'громче на 3 пункта' },
                    { cmd: '«выключи звук»', raw: 'выключи звук', desc: 'Mute (тишина)' },
                    { cmd: '«включи звук»', raw: 'включи звук', desc: 'вернуть звук' }
                ]
            },
            {
                id: 'power',
                emoji: '⚡️',
                title: 'Питание и Экран',
                commands: [
                    { cmd: '«включи телевизор»', raw: 'включи телевизор', desc: 'включить ТВ' },
                    { cmd: '«выключи телевизор»', raw: 'выключи телевизор', desc: 'выключить ТВ' },
                    { cmd: '«выключи экран»', raw: 'выключи экран', desc: 'погасить экран (звук играет)' },
                    { cmd: '«включи экран»', raw: 'включи экран', desc: 'зажечь экран' }
                ]
            },
            {
                id: 'prank',
                emoji: '🎭',
                title: 'Пранки',
                commands: [
                    { cmd: '«перегрев»', raw: 'перегрев', desc: 'экран ошибки перегрева' },
                    { cmd: '«стробоскоп»', raw: 'стробоскоп', desc: 'мигание экрана 5 сек' },
                    { cmd: '«глюк»', raw: 'глюк', desc: 'микро-помехи' },
                    { cmd: '«горки»', raw: 'горки', desc: 'звук вверх и вниз' },
                    { cmd: '«стоп»', raw: 'стоп', desc: 'остановить все пранки' }
                ]
            },
            {
                id: 'remote',
                emoji: '🕹',
                title: 'Стрелки и Кнопки пульта',
                commands: [
                    { cmd: '«вправо» / «влево» / «вниз» / «вверх»', raw: 'вправо', desc: 'листать по экрану' },
                    { cmd: '«давай» / «ок»', raw: 'давай', desc: 'центральная кнопка выбора (OK / Enter)' }
                ]
            },
            {
                id: 'search_exit',
                isCombined: true,
                blocks: [
                    {
                        id: 'search',
                        emoji: '🔍',
                        title: 'Поиск',
                        commands: [
                            { cmd: '«загугли [запрос]»', raw: 'загугли погода', desc: 'открывает Google с результатами на экране ТВ' }
                        ]
                    },
                    {
                        id: 'exit',
                        emoji: '🚪',
                        title: 'Выход',
                        commands: [
                            { cmd: '«пока» / «выход»', raw: 'пока', desc: 'закрыть навык на Станции Мини' }
                        ]
                    }
                ]
            }
        ];

        const VIDEO_PHRASES = [
            '«включи видео [любое название]»',
            '«открой видео [любое название]»',
            '«включи на ютубе [название]»',
            '«найди на ютубе [название]»',
            '«поставь видео [название]»',
            '«включи клип [название]»'
        ];

        let currentCategory = 'all';
        let currentSearch = '';

        function renderCommandButton(item) {
            return `
                <button onclick="copyCommand('${item.cmd.replace(/'/g, "\\'")}')"
                        class="cmd-row w-full text-left px-2.5 py-1.5 rounded-xl bg-white/80 border border-gray-200/60 flex items-center justify-between gap-2 group">
                    <div class="min-w-0 leading-snug">
                        <span class="font-mono text-xs font-semibold text-[#6c2bd9] group-hover:text-[#7b3fe4]">${item.cmd}</span>
                        <span class="text-xs text-gray-500"> — ${item.desc}</span>
                    </div>
                    <i data-lucide="copy" class="w-3 h-3 text-gray-300 group-hover:text-[#7b3fe4] shrink-0 transition"></i>
                </button>
            `;
        }

        function renderCategories() {
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = '';
            const q = currentSearch.trim().toLowerCase();

            COMMAND_CATEGORIES.forEach(entry => {
                // Для сдвоенной компактной карточки (Поиск + Выход)
                if (entry.isCombined) {
                    const visibleBlocks = entry.blocks.filter(b => {
                        if (currentCategory !== 'all' && currentCategory !== b.id) return false;
                        return b.commands.some(c =>
                            c.cmd.toLowerCase().includes(q) ||
                            c.desc.toLowerCase().includes(q) ||
                            b.title.toLowerCase().includes(q)
                        );
                    });

                    if (visibleBlocks.length === 0) return;

                    const card = document.createElement('div');
                    card.className = 'bento-card rounded-2xl p-3.5 flex flex-col justify-between gap-3 fade-up';
                    card.innerHTML = visibleBlocks.map(b => {
                        const cmds = b.commands.filter(c =>
                            c.cmd.toLowerCase().includes(q) ||
                            c.desc.toLowerCase().includes(q) ||
                            b.title.toLowerCase().includes(q)
                        );
                        return `
                            <div>
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="text-base">${b.emoji}</span>
                                    <h3 class="font-bold text-sm text-gray-900">${b.title}</h3>
                                </div>
                                <div class="space-y-1.5">
                                    ${cmds.map(renderCommandButton).join('')}
                                </div>
                            </div>
                        `;
                    }).join('<div class="border-t border-gray-200/70"></div>');

                    grid.appendChild(card);
                    return;
                }

                // Обычная карточка категории
                if (currentCategory !== 'all' && currentCategory !== entry.id) return;

                const filtered = entry.commands.filter(c =>
                    c.cmd.toLowerCase().includes(q) ||
                    c.desc.toLowerCase().includes(q) ||
                    entry.title.toLowerCase().includes(q)
                );

                if (filtered.length === 0) return;

                const card = document.createElement('div');
                card.className = 'bento-card rounded-2xl p-3.5 flex flex-col justify-between fade-up';
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                                <span class="text-base">${entry.emoji}</span>
                                <h3 class="font-bold text-sm text-gray-900">${entry.title}</h3>
                            </div>
                            <span class="text-[10px] font-mono font-semibold px-2 py-0.5 rounded-full bg-white text-gray-500 border border-gray-200/70">
                                ${filtered.length}
                            </span>
                        </div>
                        <div class="space-y-1.5">
                            ${filtered.map(renderCommandButton).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (grid.children.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-6 bento-card rounded-2xl">
                        <p class="text-xs text-gray-500">Ничего не найдено по запросу «${currentSearch}»</p>
                    </div>
                `;
            }

            lucide.createIcons();
